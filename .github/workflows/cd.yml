# Déploiement continu : à chaque push sur main, UNE FOIS LA CI AU VERT,
#   1. build  : images Docker (API + web) construites sur les runners de GitHub, publiées sur GHCR
#               (jamais sur le VPS : un build demande plus d'1 Go de RAM)
#   2. deploy : sur le runner auto-hébergé du VPS → ClusterIssuer si absent, Secrets k8s déchiffrés
#               avec SOPS (deploy/secrets/production.env), kubectl apply, attente de la mise à jour
#
# ⚠️ Dépôt public + runner auto-hébergé : ce workflow ne doit JAMAIS se déclencher sur
# "pull_request" (le code d'un fork s'exécuterait sur ton VPS). Il ne tourne que sur main.
#
# Configuration : voir DOCS/DEPLOY-K3S.md
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" pour redéployer à la main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # workflow_run se déclenche aussi quand la CI échoue : on ne déploie que si elle a réussi,
    # et uniquement pour un push (jamais pour une PR)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publier les images sur ghcr.io
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # le commit validé par la CI (et pas un éventuel push arrivé entre-temps)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nom de l'image
        id: image
        run: |
          # GHCR exige un nom en minuscules (Fay3l → fay3l)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "ref=ghcr.io/${owner}/readlog-${{ matrix.name }}:${sha}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/readlog-${{ matrix.name }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # tag = hash du commit : chaque version est identifiable et on peut revenir en arrière
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          # l'URL de l'API est écrite dans le JavaScript au moment du build de la version web
          build-args: |
            EXPO_PUBLIC_API_URL=https://${{ vars.READLOG_DOMAIN }}/api
            EXPO_PUBLIC_APK_URL=${{ vars.APK_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    # Runner installé sur le VPS (étiquette ajoutée à son installation, voir le guide)
    runs-on: [self-hosted, readlog-vps]
    # Environnement GitHub "production" : limité à la branche main dans les réglages du dépôt
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DOMAIN: ${{ vars.READLOG_DOMAIN }}
    steps:
      # Seul le dossier deploy/ est utile ici : pas besoin de tout le code sur le VPS
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy

      - name: Kubeconfig du compte de déploiement
        run: |
          # kubeconfig LIMITÉ (namespace readlog) de l'utilisateur du runner.
          # Sans ça, le kubectl de k3s chercherait le fichier administrateur.
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          test -n "$DOMAIN" || { echo "::error::Variable READLOG_DOMAIN manquante"; exit 1; }

      - name: ClusterIssuer Let's Encrypt (si absent)
        run: |
          # Partagé avec tes autres sites : créé seulement s'il n'existe pas, jamais modifié
          if kubectl get clusterissuer letsencrypt-prod >/dev/null 2>&1; then
            echo "ClusterIssuer letsencrypt-prod déjà présent"
          else
            kubectl create -f deploy/k8s/setup/cluster-issuer.yaml
          fi

      - name: Secrets Kubernetes (déchiffrés avec SOPS)
        id: secrets
        run: |
          set -euo pipefail
          # Clé privée age du VPS : seule machine (avec ton PC) capable de déchiffrer les secrets.
          # Elle n'est jamais dans Git ni dans GitHub.
          export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/keys.txt"
          test -r "$SOPS_AGE_KEY_FILE" || { echo "::error::Clé age du VPS introuvable ($SOPS_AGE_KEY_FILE)"; exit 1; }
          test -f deploy/secrets/production.env || { echo "::error::deploy/secrets/production.env manquant (voir le guide, étape 4)"; exit 1; }

          # Fichiers temporaires lisibles par le seul utilisateur du runner (umask 077).
          # --from-env-file plutôt que --from-literal : les valeurs n'apparaissent pas dans
          # la liste des processus (ps), visible par les autres utilisateurs du VPS.
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/secrets.XXXXXX")
          trap 'rm -rf "$dir"' EXIT

          # Déchiffrement : les valeurs ne passent que par ce dossier temporaire
          sops decrypt --input-type dotenv --output-type dotenv deploy/secrets/production.env > "$dir/all.env"
          # Lecture ligne à ligne (et pas "source" : une valeur ne doit jamais être exécutée)
          declare -A S=()
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            S["${line%%=*}"]="${line#*=}"
          done < "$dir/all.env"
          DB_PASSWORD="${S[DB_PASSWORD]:-}"
          SECRET_KEY="${S[SECRET_KEY]:-}"
          [ "${#SECRET_KEY}" -ge 32 ] || { echo "::error::SECRET_KEY absente ou trop courte (32 caractères min.)"; exit 1; }
          [ -n "$DB_PASSWORD" ] || { echo "::error::DB_PASSWORD absent"; exit 1; }

          printf 'password=%s\n' "$DB_PASSWORD" > "$dir/db.env"
          {
            printf 'DATABASE_URL=postgresql://readlog:%s@postgres:5432/readlog\n' "$DB_PASSWORD"
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            for key in MAIL_SERVER MAIL_USERNAME MAIL_PASSWORD MAIL_FROM GOOGLE_BOOKS_API_KEY; do
              printf '%s=%s\n' "$key" "${S[$key]:-}"
            done
          } > "$dir/api.env"

          # "create --dry-run | apply" : crée le Secret la 1re fois, le met à jour ensuite
          kubectl -n readlog create secret generic readlog-db --from-env-file="$dir/db.env" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n readlog create secret generic readlog-api --from-env-file="$dir/api.env" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Empreinte des secrets : si elle change, l'API redémarre (annotation dans api.yaml)
          echo "hash=$(cat "$dir/db.env" "$dir/api.env" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Déployer
        env:
          SECRETS_HASH: ${{ steps.secrets.outputs.hash }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # kustomize assemble les manifests ; sed remplace les 4 variables (délimiteur # : les
          # noms d'images contiennent des "/")
          kubectl kustomize deploy/k8s/app | sed \
            -e "s#\${DOMAIN}#${DOMAIN}#g" \
            -e "s#\${API_IMAGE}#ghcr.io/${owner}/readlog-api:${SHA}#g" \
            -e "s#\${WEB_IMAGE}#ghcr.io/${owner}/readlog-web:${SHA}#g" \
            -e "s#\${SECRETS_HASH}#${SECRETS_HASH}#g" > "$RUNNER_TEMP/rendered.yaml"
          if grep -n '\${' "$RUNNER_TEMP/rendered.yaml"; then
            echo "::error::Variable non remplacée dans les manifests"; exit 1
          fi
          kubectl apply -f "$RUNNER_TEMP/rendered.yaml"
          kubectl -n readlog rollout status statefulset/postgres --timeout=180s
          kubectl -n readlog rollout status deployment/readlog-api --timeout=300s
          kubectl -n readlog rollout status deployment/readlog-web --timeout=180s

      - name: Logs en cas d'échec
        if: failure()
        run: |
          kubectl -n readlog get pods || true
          kubectl -n readlog logs deployment/readlog-api -c migrate --tail=50 || true
          kubectl -n readlog logs deployment/readlog-api -c api --tail=50 || true

      - name: Vérifier que le site répond
        run: |
          for i in $(seq 1 10); do
            curl -fsS "https://${DOMAIN}/api/docs" -o /dev/null && echo "✅ En ligne : https://${DOMAIN}" && exit 0
            sleep 6
          done
          echo "::error::https://${DOMAIN} ne répond pas" && exit 1
