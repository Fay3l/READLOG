# À appliquer UNE SEULE FOIS sur le serveur, après l'installation de cert-manager :
#   kubectl apply -f deploy/k8s/setup/cluster-issuer.yaml
# Sert à tous les sites du cluster (store, apps clients…).
# installer dans le serveur 
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: contact@faystack.fr # reçoit les alertes d'expiration
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
