# Pare-feu interne : seuls l'API et la sauvegarde peuvent parler à Postgres.
# Si un autre pod du cluster était compromis, il ne pourrait pas atteindre la base.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["readlog-api", "readlog-backup"]
      ports:
        - port: 5432
