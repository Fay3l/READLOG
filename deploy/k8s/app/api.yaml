# API FastAPI. Avant chaque démarrage, un "initContainer" met le schéma de la base à jour.
apiVersion: v1
kind: ConfigMap
metadata:
  name: readlog-api-config
data:
  # Valeurs non secrètes. Les secrets (SECRET_KEY, DATABASE_URL, SMTP...) sont dans le Secret readlog-api.
  CORS_ORIGINS: https://${DOMAIN}
  ACCESS_TOKEN_EXPIRE: "10080"
---
apiVersion: v1
kind: Service
metadata:
  name: readlog-api
  labels: { app.kubernetes.io/name: readlog-api }
spec:
  selector: { app.kubernetes.io/name: readlog-api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readlog-api
  labels: { app.kubernetes.io/name: readlog-api }
spec:
  replicas: 1
  # Mise à jour sans coupure : la nouvelle version démarre AVANT que l'ancienne s'arrête
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: readlog-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: readlog-api }
    spec:
      # Sécurité du pod : jamais root, pas d'élévation de privilèges, profil seccomp par défaut
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: ${API_IMAGE}
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - secretRef: { name: readlog-api }
            - configMapRef: { name: readlog-api-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 160Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: ${API_IMAGE}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: readlog-api }
            - configMapRef: { name: readlog-api-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # readiness : reçoit du trafic seulement quand il répond ; liveness : redémarré s'il ne répond plus
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 192Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
