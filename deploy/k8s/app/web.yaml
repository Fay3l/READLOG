# Version web (PWA) : fichiers statiques servis par nginx (~5 Mo de RAM)
apiVersion: v1
kind: Service
metadata:
  name: readlog-web
  labels: { app.kubernetes.io/name: readlog-web }
spec:
  selector: { app.kubernetes.io/name: readlog-web }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readlog-web
  labels: { app.kubernetes.io/name: readlog-web }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: readlog-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: readlog-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # utilisateur "nginx" de l'image nginx-unprivileged
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ${WEB_IMAGE}
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 48Mi }
          # nginx écrit quelques fichiers temporaires : dossiers en mémoire, le reste en lecture seule
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: cache
          emptyDir: { sizeLimit: 16Mi }
