# Point d'entrée HTTPS : un seul domaine pour le site ET l'API
#   https://${DOMAIN}/api/...  → API
#   https://${DOMAIN}/...      → site web (PWA)
# Même origine pour le navigateur : pas de problème de CORS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  # http://... → https://... (redirection permanente)
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readlog
  annotations:
    # cert-manager voit cette annotation et demande le certificat à Let's Encrypt
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<nom>@kubernetescrd : la façon dont Traefik désigne un Middleware
    traefik.ingress.kubernetes.io/router.middlewares: readlog-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${DOMAIN}"]
      secretName: readlog-tls # cert-manager y range le certificat et le renouvelle tout seul
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: readlog-api, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: readlog-web, port: { number: 8080 } }
