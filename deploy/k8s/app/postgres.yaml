# PostgreSQL : StatefulSet (et non Deployment) car il a besoin d'un disque qui le suit
# à chaque redémarrage. Le mot de passe vient du Secret "readlog-db" (créé à la main, jamais
# dans Git — voir deploy/create-secrets.sh).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  # Service interne uniquement (ClusterIP) : la base n'est JAMAIS exposée sur internet
  type: ClusterIP
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      securityContext:
        fsGroup: 70 # utilisateur "postgres" de l'image alpine
      containers:
        - name: postgres
          image: postgres:17-alpine
          # Réglages pour un petit VPS (~60 Mo de RAM au lieu de ~150 Mo par défaut)
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=20
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=16MB
            - -c
            - effective_cache_size=96MB
            - -c
            - wal_buffers=1MB
          env:
            - name: POSTGRES_DB
              value: readlog
            - name: POSTGRES_USER
              value: readlog
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: readlog-db, key: password }
            # sous-dossier : le volume contient un "lost+found" qui gênerait initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "readlog", "-d", "readlog"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "readlog", "-d", "readlog"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 192Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # Disque persistant créé automatiquement (local-path : un dossier sur le VPS, fourni par k3s)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
