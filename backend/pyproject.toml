[project]
name = "backend"
version = "0.1.0"
description = "API de ReadLog : suivi de lectures (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.2",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.136.1",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F : erreurs de base, I : tri des imports, B : bugs fréquents, UP : syntaxe Python moderne
select = ["E", "F", "I", "B", "UP"]
# B008 : Depends(...) en valeur par défaut est le style normal de FastAPI
ignore = ["B008"]

